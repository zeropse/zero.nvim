name: 🐛 Bug Report
description: Create a report to help us fix a bug or issue in zero.nvim
title: '[BUG]: '
labels: ['bug']
assignees: ''

body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue with zero.nvim!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open file '...'
        2. Press key '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Output of `:checkhealth` or Neovim version info.
      placeholder: |
        - OS: macOS / Linux
        - Neovim Version: v0.10.x
    validations:
      required: false
