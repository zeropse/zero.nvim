name: 🐛 Bug Report
description: Create a report to help us fix a bug or issue in zero.nvim
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open file '...'
        2. Press key '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS and Neovim version info
      placeholder: macOS / Neovim v0.10+
    validations:
      required: false
